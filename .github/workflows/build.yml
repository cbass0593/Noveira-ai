name: Build Noveira AI Release AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile & Package Android Release Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Assemble Noveira AI Web Engine
        run: |
          mkdir -p src dist
          cat << 'EOF' > package.json
          {
            "name": "noveira-ai",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "vite build"
            },
            "dependencies": {
              "@capacitor/android": "^6.1.2",
              "@capacitor/cli": "^6.1.2",
              "@capacitor/core": "^6.1.2",
              "lucide-react": "^0.344.0",
              "react": "^18.2.0",
              "react-dom": "^18.2.0"
            },
            "devDependencies": {
              "@vitejs/plugin-react": "^4.2.1",
              "vite": "^5.1.4"
            }
          }
          EOF

          cat << 'EOF' > vite.config.js
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';
          export default defineConfig({
            plugins: [react()],
            build: { outDir: 'dist' }
          });
          EOF

          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
              <title>Noveira AI</title>
              <style>
                * { box-sizing: border-box; margin: 0; padding: 0; }
                body { background: #0E071A; color: #FAF8F5; font-family: -apple-system, sans-serif; }
              </style>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
          EOF

          cat << 'EOF' > src/main.jsx
          import React, { useState, useEffect } from 'react';
          import ReactDOM from 'react-dom/client';

          function App() {
            const [tab, setTab] = useState('closet');
            const [items, setItems] = useState(() => {
              const saved = localStorage.getItem('noveira_closet');
              return saved ? JSON.parse(saved) : [
                { id: '1', name: 'Silk Ivory Blouse', category: 'Tops', brand: 'Haute Maison' },
                { id: '2', name: 'Tailored Black Trousers', category: 'Bottoms', brand: 'Atelier' },
                { id: '3', name: 'Cashmere Camel Coat', category: 'Outerwear', brand: 'Editorial' }
              ];
            });
            const [name, setName] = useState('');
            const [category, setCategory] = useState('Tops');

            useEffect(() => {
              localStorage.setItem('noveira_closet', JSON.stringify(items));
            }, [items]);

            const addItem = (e) => {
              e.preventDefault();
              if (!name.trim()) return;
              setItems([{ id: Date.now().toString(), name, category, brand: 'Custom' }, ...items]);
              setName('');
            };

            const clearAllData = () => {
              if (confirm('Permanently delete all wardrobe items and reset your closet?')) {
                localStorage.clear();
                setItems([]);
              }
            };

            return (
              <div style={{ minHeight: '100vh', background: '#0E071A', color: '#FAF8F5', paddingBottom: '70px' }}>
                <header style={{ padding: '16px', background: '#180D2B', borderBottom: '1px solid #3D246C', textAlign: 'center' }}>
                  <h1 style={{ color: '#E0B865', letterSpacing: '4px', fontSize: '20px', fontFamily: 'serif' }}>NOVEIRA AI</h1>
                  <p style={{ fontSize: '10px', color: '#B9A9D0', letterSpacing: '2px' }}>DIGITAL WARDROBE & PERSONAL STYLIST</p>
                </header>

                <main style={{ padding: '16px' }}>
                  {tab === 'closet' && (
                    <div>
                      <form onSubmit={addItem} style={{ background: '#180D2B', border: '1px solid #3D246C', padding: '16px', borderRadius: '12px', marginBottom: '16px' }}>
                        <h3 style={{ fontSize: '14px', marginBottom: '12px', color: '#E0B865' }}>Add New Garment</h3>
                        <input value={name} onChange={e=>setName(e.target.value)} placeholder="Garment name..." style={{ width: '100%', padding: '10px', background: '#0E071A', border: '1px solid #3D246C', color: '#FFF', borderRadius: '8px', marginBottom: '8px', boxSizing: 'border-box' }} />
                        <select value={category} onChange={e=>setCategory(e.target.value)} style={{ width: '100%', padding: '10px', background: '#0E071A', border: '1px solid #3D246C', color: '#FFF', borderRadius: '8px', marginBottom: '12px' }}>
                          <option>Tops</option><option>Bottoms</option><option>Outerwear</option><option>Footwear</option><option>Accessories</option>
                        </select>
                        <button type="submit" style={{ width: '100%', padding: '12px', background: '#E0B865', color: '#0E071A', fontWeight: 'bold', border: 'none', borderRadius: '8px' }}>Save to Closet</button>
                      </form>

                      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                        {items.map(i => (
                          <div key={i.id} style={{ background: '#180D2B', border: '1px solid #3D246C', padding: '12px', borderRadius: '10px' }}>
                            <p style={{ fontWeight: 'bold', fontSize: '13px' }}>{i.name}</p>
                            <p style={{ fontSize: '10px', color: '#E0B865' }}>{i.category}</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {tab === 'stylist' && (
                    <div style={{ background: '#180D2B', border: '1px solid #3D246C', padding: '20px', borderRadius: '12px', textAlign: 'center' }}>
                      <h2 style={{ color: '#E0B865', fontFamily: 'serif', marginBottom: '8px' }}>Personal Stylist Consultation</h2>
                      <p style={{ fontSize: '12px', color: '#B9A9D0', marginBottom: '16px' }}>Curated look based on your {items.length} wardrobe pieces:</p>
                      <div style={{ background: '#0E071A', border: '1px solid #E0B865', padding: '16px', borderRadius: '8px', textAlign: 'left' }}>
                        <p style={{ color: '#E0B865', fontWeight: 'bold', fontSize: '13px' }}>Look 1: Metropolitan Minimalist</p>
                        <p style={{ fontSize: '12px', marginTop: '6px' }}>Combine your Silk Ivory Blouse with Tailored Black Trousers and drape the Cashmere Camel Coat for effortless evening elegance.</p>
                      </div>
                    </div>
                  )}

                  {tab === 'settings' && (
                    <div style={{ background: '#180D2B', border: '1px solid #3D246C', padding: '20px', borderRadius: '12px' }}>
                      <h3 style={{ color: '#FAF8F5', marginBottom: '12px' }}>Data & Privacy Control</h3>
                      <p style={{ fontSize: '12px', color: '#B9A9D0', marginBottom: '16px' }}>Your wardrobe data is stored locally on your device.</p>
                      <button onClick={clearAllData} style={{ width: '100%', padding: '12px', background: '#7F1D1D', color: '#FECACA', fontWeight: 'bold', border: '1px solid #EF4444', borderRadius: '8px' }}>
                        Erase All Wardrobe Data
                      </button>
                    </div>
                  )}
                </main>

                <nav style={{ position: 'fixed', bottom: 0, left: 0, right: 0, height: '56px', background: '#180D2B', borderTop: '1px solid #3D246C', display: 'flex', justifyContent: 'space-around', alignItems: 'center' }}>
                  <button onClick={()=>setTab('closet')} style={{ background: 'none', border: 'none', color: tab==='closet'?'#E0B865':'#B9A9D0', fontWeight: 'bold' }}>Closet</button>
                  <button onClick={()=>setTab('stylist')} style={{ background: 'none', border: 'none', color: tab==='stylist'?'#E0B865':'#B9A9D0', fontWeight: 'bold' }}>AI Stylist</button>
                  <button onClick={()=>setTab('settings')} style={{ background: 'none', border: 'none', color: tab==='settings'?'#E0B865':'#B9A9D0', fontWeight: 'bold' }}>Privacy</button>
                </nav>
              </div>
            );
          }

          ReactDOM.createRoot(document.getElementById('root')).render(<App />);
          EOF

      - name: Build Web Application
        run: |
          npm install
          npm run build

      - name: Initialize Native Android Layer
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "ai.noveira.app",
            "appName": "Noveira AI",
            "webDir": "dist"
          }
          EOF
          npx cap add android

      - name: Configure Android Package & SDK
        run: |
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/' android/variables.gradle || true
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/' android/variables.gradle || true
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 26/' android/variables.gradle || true

      - name: Create Production Upload Keystore
        run: |
          keytool -genkeypair -v -keystore android/app/upload.keystore \
            -alias noveira-upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass noveira2026 \
            -keypass noveira2026 \
            -dname "CN=Noveira AI, OU=Mobile, O=Apex Innovationz, C=US"

          cat << 'EOF' >> android/app/build.gradle
          android {
              signingConfigs {
                  release {
                      storeFile file('upload.keystore')
                      storePassword 'noveira2026'
                      keyAlias 'noveira-upload'
                      keyPassword 'noveira2026'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: Build Android App Bundle (AAB)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: noveira-ai-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
