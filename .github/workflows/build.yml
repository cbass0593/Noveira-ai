name: Build Noveira AI Release AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile & Package Android Release Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Accept Android SDK Licenses & Install API 36
        run: |
          yes | sdkmanager --licenses || true
          yes | sdkmanager "platforms;android-36" || true

      - name: Assemble Noveira AI Web Engine
        run: |
          mkdir -p src dist
          cat << 'EOF' > package.json
          {
            "name": "noveira-ai",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "vite build"
            },
            "dependencies": {
              "@capacitor/android": "^6.1.2",
              "@capacitor/cli": "^6.1.2",
              "@capacitor/core": "^6.1.2",
              "lucide-react": "^0.344.0",
              "react": "^18.2.0",
              "react-dom": "^18.2.0"
            },
            "devDependencies": {
              "@vitejs/plugin-react": "^4.2.1",
              "vite": "^5.1.4"
            }
          }
          EOF

          cat << 'EOF' > vite.config.js
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';
          export default defineConfig({
            plugins: [react()],
            build: { outDir: 'dist' }
          });
          EOF

          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
              <title>Noveira AI</title>
              <style>
                * { box-sizing: border-box; margin: 0; padding: 0; }
                body { background: #0E071A; color: #FAF8F5; font-family: -apple-system, sans-serif; }
              </style>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
          EOF

          cat << 'EOF' > src/main.jsx
