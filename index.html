<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Noveira AI — Digital Wardrobe & Personal Stylist</title>
  
  <!-- Luxury Editorial Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- React & Babel Core -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #0E071A;
      color: #FAF8F5;
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }
    .font-serif { font-family: 'Playfair Display', Georgia, serif; }
    .gold-gradient-text {
      background: linear-gradient(135deg, #FFF5DB 0%, #E0B865 50%, #C9A14F 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .gold-btn {
      background: linear-gradient(135deg, #F2D594 0%, #E0B865 50%, #C9A14F 100%);
      color: #0E071A;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(224, 184, 101, 0.25);
      transition: transform 0.15s ease;
    }
    .gold-btn:active { transform: scale(0.97); }
    .card-glass {
      background: #180D2B;
      border: 1px solid #3D246C;
      border-radius: 14px;
    }
    input, select {
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: #E0B865 !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEFAULT_CLOTHES = [
      { id: '1', name: 'Silk Ivory Blouse', category: 'Tops', brand: 'Atelier Maison', color: 'Ivory', isFav: true },
      { id: '2', name: 'Tailored Wool Trousers', category: 'Bottoms', brand: 'Haute Couture', color: 'Midnight Black', isFav: true },
      { id: '3', name: 'Cashmere Camel Trench Coat', category: 'Outerwear', brand: 'Editorial Luxury', color: 'Camel', isFav: false },
      { id: '4', name: 'Italian Leather Chelsea Boots', category: 'Footwear', brand: 'Milano Bespoke', color: 'Espresso', isFav: true },
      { id: '5', name: 'Gold Chain Quilted Handbag', category: 'Accessories', brand: 'Chanel Classic', color: 'Champagne Gold', isFav: false }
    ];

    function App() {
      // User authentication state
      const [user, setUser] = useState(() => {
        const savedUser = localStorage.getItem('noveira_user');
        return savedUser ? JSON.parse(savedUser) : null;
      });

      // Navigation: 'closet', 'stylist', 'premium', 'account'
      const [tab, setTab] = useState('closet');
      const [filter, setFilter] = useState('All');

      // Auth form state
      const [isSignUp, setIsSignUp] = useState(false);
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authName, setAuthName] = useState('');

      // Premium subscription plan state
      const [selectedPlan, setSelectedPlan] = useState('monthly');
      const [subscribedMessage, setSubscribedMessage] = useState(false);

      // Wardrobe state
      const [items, setItems] = useState(() => {
        const local = localStorage.getItem('noveira_web_closet');
        return local ? JSON.parse(local) : DEFAULT_CLOTHES;
      });

      const [name, setName] = useState('');
      const [category, setCategory] = useState('Tops');
      const [brand, setBrand] = useState('');

      // Stylist state
      const [occasion, setOccasion] = useState('Dinner Date & Cocktails');
      const [styledLook, setStyledLook] = useState(null);
      const [loadingStylist, setLoadingStylist] = useState(false);

      useEffect(() => {
        localStorage.setItem('noveira_web_closet', JSON.stringify(items));
      }, [items]);

      useEffect(() => {
        if (user) {
          localStorage.setItem('noveira_user', JSON.stringify(user));
        } else {
          localStorage.removeItem('noveira_user');
        }
      }, [user]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (!authEmail.trim() || !authPassword.trim()) return;
        setUser({
          name: authName.trim() || authEmail.split('@')[0],
          email: authEmail.trim(),
          tier: 'free'
        });
      };

      const handleSignOut = () => {
        setUser(null);
        setTab('closet');
      };

      const handleUpgrade = () => {
        if (!user) {
          setTab('account');
          return;
        }
        setUser({ ...user, tier: selectedPlan === 'monthly' ? 'vip_monthly' : 'vip_annual' });
        setSubscribedMessage(true);
        setTimeout(() => setSubscribedMessage(false), 3000);
      };

      const handleAddGarment = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        setItems([{
          id: Date.now().toString(),
          name: name.trim(),
          category,
          brand: brand.trim() || 'Custom',
          isFav: false
        }, ...items]);
        setName('');
        setBrand('');
      };

      const toggleFav = (id) => {
        setItems(items.map(i => i.id === id ? { ...i, isFav: !i.isFav } : i));
      };

      const deleteItem = (id) => {
        if (confirm('Permanently remove this garment from your closet?')) {
          setItems(items.filter(i => i.id !== id));
        }
      };

      const curateOutfit = () => {
        setLoadingStylist(true);
        setTimeout(() => {
          setLoadingStylist(false);
          setStyledLook({
            title: 'Metropolitan Elegance',
            occasion: occasion,
            pieces: items.slice(0, 3),
            explanation: `Curated exclusively for ${occasion}. Combining your ${items[0]?.name || 'Top'} with ${items[1]?.name || 'Bottom'} achieves sleek editorial balance.`
          });
        }, 900);
      };

      const filteredItems = filter === 'All' ? items : items.filter(i => i.category === filter);

      return (
        <div style={{ maxWidth: '480px', margin: '0 auto', minHeight: '100vh', paddingBottom: '80px', position: 'relative' }}>
          
          {/* Top Luxury Header with VIP Badge */}
          <header style={{ padding: '16px 20px', background: 'rgba(24, 13, 43, 0.95)', borderBottom: '1px solid #3D246C', backdropFilter: 'blur(10px)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div style={{ textAlign: 'left' }}>
              <h1 className="font-serif gold-gradient-text" style={{ fontSize: '22px', letterSpacing: '3px', fontWeight: 700 }}>NOVEIRA AI</h1>
              <p style={{ fontSize: '9px', color: '#B9A9D0', letterSpacing: '2px', textTransform: 'uppercase' }}>Haute Wardrobe Atelier</p>
