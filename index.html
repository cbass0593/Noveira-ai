<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Noveira AI — Digital Wardrobe & Personal Stylist</title>
  
  <!-- Luxury Editorial Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #0E071A;
      color: #FAF8F5;
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }
    .font-serif { font-family: 'Playfair Display', Georgia, serif; }
    .gold-gradient-text {
      background: linear-gradient(135deg, #FFF5DB 0%, #E0B865 50%, #C9A14F 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .gold-btn {
      background: linear-gradient(135deg, #F2D594 0%, #E0B865 50%, #C9A14F 100%);
      color: #0E071A;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(224, 184, 101, 0.25);
      transition: transform 0.15s ease;
    }
    .gold-btn:active { transform: scale(0.97); }
    .card-glass {
      background: #180D2B;
      border: 1px solid #3D246C;
      border-radius: 14px;
    }
    input, select {
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: #E0B865 !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEFAULT_CLOTHES = [
      { id: '1', name: 'Silk Ivory Blouse', category: 'Tops', brand: 'Atelier Maison', color: 'Ivory', isFav: true, img: 'https://images.unsplash.com/photo-1598554747436-c9293d6a588f?auto=format&fit=crop&w=400&q=80' },
      { id: '2', name: 'Tailored Wool Trousers', category: 'Bottoms', brand: 'Haute Bespoke', color: 'Midnight Black', isFav: true, img: 'https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?auto=format&fit=crop&w=400&q=80' },
      { id: '3', name: 'Cashmere Camel Trench Coat', category: 'Outerwear', brand: 'Editorial Luxury', color: 'Camel', isFav: false, img: 'https://images.unsplash.com/photo-1544923246-77307dd654cb?auto=format&fit=crop&w=400&q=80' },
      { id: '4', name: 'Leather Chelsea Boots', category: 'Footwear', brand: 'Milano Bespoke', color: 'Espresso', isFav: true, img: 'https://images.unsplash.com/photo-1543163521-1bf539c55dd2?auto=format&fit=crop&w=400&q=80' },
      { id: '5', name: 'Quilted Chain Shoulder Bag', category: 'Accessories', brand: 'Chanel Classic', color: 'Champagne Gold', isFav: false, img: 'https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=400&q=80' }
    ];

    function App() {
      const [user, setUser] = useState(() => {
        const saved = localStorage.getItem('noveira_user');
        return saved ? JSON.parse(saved) : null;
      });

      const [tab, setTab] = useState('closet');
      const [filter, setFilter] = useState('All');

      // Auth form
      const [isSignUp, setIsSignUp] = useState(false);
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authName, setAuthName] = useState('');

      // Premium plan
      const [selectedPlan, setSelectedPlan] = useState('monthly');
      const [vipSuccess, setVipSuccess] = useState(false);

      // Wardrobe items
      const [items, setItems] = useState(() => {
        const local = localStorage.getItem('noveira_web_closet');
        return local ? JSON.parse(local) : DEFAULT_CLOTHES;
      });

      // Saved lookbook outfits
      const [savedOutfits, setSavedOutfits] = useState(() => {
        const local = localStorage.getItem('noveira_saved_outfits');
        return local ? JSON.parse(local) : [];
      });

      // Add item form
      const [name, setName] = useState('');
      const [category, setCategory] = useState('Tops');
      const [brand, setBrand] = useState('');
      const [photoUrl, setPhotoUrl] = useState('');

      // Stylist state
      const [occasion, setOccasion] = useState('Dinner Date & Cocktails');
      const [climate, setClimate] = useState('Cool Evening / Autumn');
      const [styledLook, setStyledLook] = useState(null);
      const [loadingStylist, setLoadingStylist] = useState(false);

      useEffect(() => {
        localStorage.setItem('noveira_web_closet', JSON.stringify(items));
      }, [items]);

      useEffect(() => {
        localStorage.setItem('noveira_saved_outfits', JSON.stringify(savedOutfits));
      }, [savedOutfits]);

      useEffect(() => {
        if (user) localStorage.setItem('noveira_user', JSON.stringify(user));
        else localStorage.removeItem('noveira_user');
      }, [user]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (!authEmail.trim() || !authPassword.trim()) return;
        setUser({
          name: authName.trim() || authEmail.split('@')[0],
          email: authEmail.trim(),
          tier: 'free'
        });
      };

      const handleSignOut = () => {
        setUser(null);
        setTab('closet');
      };

      const handleUpgrade = () => {
        if (!user) {
          setTab('account');
          return;
        }
        setUser({ ...user, tier: selectedPlan === 'monthly' ? 'vip_monthly' : 'vip_annual' });
        setVipSuccess(true);
        setTimeout(() => setVipSuccess(false), 3000);
      };

      const handleAddGarment = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        const newItem = {
          id: Date.now().toString(),
          name: name.trim(),
          category,
          brand: brand.trim() || 'Haute Maison',
          color: 'Versatile',
          isFav: false,
          img: photoUrl.trim() || 'https://images.unsplash.com/photo-1598554747436-c9293d6a588f?auto=format&fit=crop&w=400&q=80'
        };
        setItems([newItem, ...items]);
        setName('');
        setBrand('');
        setPhotoUrl('');
      };

      const toggleFav = (id) => {
        setItems(items.map(i => i.id === id ? { ...i, isFav: !i.isFav } : i));
      };

      const deleteItem = (id) => {
        if (confirm('Permanently remove this piece from your closet?')) {
          setItems(items.filter(i => i.id !== id));
        }
      };

      const curateOutfit = () => {
        setLoadingStylist(true);
        setTimeout(() => {
          setLoadingStylist(false);
          const top = items.find(i => i.category === 'Tops') || items[0];
          const bottom = items.find(i => i.category === 'Bottoms') || items[1];
          const outer = items.find(i => i.category === 'Outerwear') || items[2];
          const selected = [top, bottom, outer].filter(Boolean);

          setStyledLook({
            title: `Atelier Look for ${occasion}`,
            occasion: occasion,
            pieces: selected,
            explanation: `Curated exclusively for ${occasion} in ${climate}. Combining the ${top?.name || 'top'} with ${bottom?.name || 'bottom'} achieves sleek proportions, completed by the ${outer?.name || 'layer'}.`
          });
        }, 800);
      };

      const saveCurrentLook = () => {
        if (!styledLook) return;
        setSavedOutfits([styledLook, ...savedOutfits]);
        alert('Lookbook combination saved!');
      };

      const clearAllData = () => {
        if (confirm('Permanently erase all wardrobe items, outfits, and reset the app?')) {
          localStorage.clear();
          window.location.reload();
        }
      };

      const filteredItems = filter === 'All' ? items : items.filter(i => i.category === filter);
      const isVip = user && user.tier !== 'free';

      return (
        <div style={{ maxWidth: '480px', margin: '0 auto', minHeight: '100vh', paddingBottom: '80px', position: 'relative' }}>
          
          {/* Header */}
          <header style={{ padding: '16px 20px', background: 'rgba(24, 13, 43, 0.95)', borderBottom: '1px solid #3D246C', backdropFilter: 'blur(10px)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div style={{ textAlign: 'left' }}>
              <h1 className="font-serif gold-gradient-text" style={{ fontSize: '22px', letterSpacing: '3px', fontWeight: 700 }}>NOVEIRA AI</h1>
              <p style={{ fontSize: '9px', color: '#B9A9D0', letterSpacing: '2px', textTransform: 'uppercase' }}>Haute Wardrobe Atelier</p>
            </div>

            {isVip ? (
              <div style={{ background: 'rgba(224, 184, 101, 0.15)', border: '1px solid #E0B865', padding: '4px 10px', borderRadius: '20px', fontSize: '11px', color: '#F2D594', fontWeight: 700 }}>
                👑 VIP ELITE
              </div>
            ) : (
              <button onClick={() => setTab('premium')} className="gold-btn" style={{ padding: '6px 14px', borderRadius: '20px', fontSize: '11px', display: 'flex', alignItems: 'center', gap: '4px' }}>
                <span>👑</span> Upgrade
              </button>
            )}
          </header>

          <main style={{ padding: '16px' }}>

            {/* TAB 1: CLOSET */}
            {tab === 'closet' && (
              <div>
                <form onSubmit={handleAddGarment} className="card-glass" style={{ padding: '18px', marginBottom: '18px' }}>
                  <h3 className="font-serif" style={{ color: '#E0B865', fontSize: '16px', marginBottom: '12px' }}>Add Garment to Closet</h3>
                  <input
                    type="text"
                    required
                    value={name}
                    onChange={e => setName(e.target.value)}
                    placeholder="Garment name (e.g. Silk Ivory Blouse)..."
                    style={{ width: '100%', padding: '12px', background: '#10061F', border: '1px solid #3D246C', color: '#FAF8F5', borderRadius: '10px', marginBottom: '8px', fontSize: '13px' }}
                  />
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', marginBottom: '8px' }}>
                    <select
                      value={category}
                      onChange={e => setCategory(e.target.value)}
                      style={{ padding: '10px', background: '#10061F', border: '1px solid #3D246C', color: '#FAF8F5', borderRadius: '10px', fontSize: '12px' }}
                    >
                      <option>Tops</option><option>Bottoms</option><option>Outerwear</option><option>Footwear</option><option>Accessories</option>
                    </select>
                    <input
                      type="text"
                      value={brand}
                      onChange={e => setBrand(e.target.value)}
                      placeholder="Brand / Maison..."
                      style={{ padding: '10px', background: '#10061F', border: '1px solid #3D246C', color: '#FAF8F5', borderRadius: '10px', fontSize: '12px' }}
                    />
                  </div>
                  <input
                    type="url"
                    value={photoUrl}
                    onChange={e => setPhotoUrl(e.target.value)}
                    placeholder="Optional image URL..."
                    style={{ width: '100%', padding: '10px', background: '#10061F', border: '1px solid #3D246C', color: '#FAF8F5', borderRadius: '10px', marginBottom: '12px', fontSize: '12px' }}
                  />
                  <button type="submit" className="gold-btn" style={{ width: '100%', padding: '12px', borderRadius: '10px', fontSize: '13px' }}>
                    Save to Collection
                  </button>
                </form>

                {/* Filter Chips */}
                <div style={{ display: 'flex', gap: '8px', overflowX: 'auto', paddingBottom: '12px', marginBottom: '8px' }}>
                  {['All', 'Tops', 'Bottoms', 'Outerwear', 'Footwear', 'Accessories'].map(cat => (
                    <button
                      key={cat}
                      onClick={() => setFilter(cat)}
                      style={{
                        padding: '6px 14px',
                        borderRadius: '20px',
                        fontSize: '11px',
                        border: '1px solid #3D246C',
                        background: filter === cat ? '#E0B865' : '#180D2B',
                        color: filter === cat ? '#0E071A' : '#FAF8F5',
                        fontWeight: filter === cat ? 700 : 500,
                        whiteSpace: 'nowrap',
                        cursor: 'pointer'
                      }}
                    >
                      {cat}
                    </button>
                  ))}
                </div>

                {/* Garments Grid */}
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                  {filteredItems.map(item => (
                    <div key={item.id} className="card-glass" style={{ overflow: 'hidden', position: 'relative' }}>
                      <div style={{ height: '140px', width: '100%', background: '#000', position: 'relative' }}>
                        <img src={item.img} alt={item.name} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                        <span onClick={() => toggleFav(item.id)} style={{ position: 'absolute', top: '8px', right: '8px', cursor: 'pointer', background: 'rgba(0,0,0,0.6)', borderRadius: '50%', padding: '4px 6px', fontSize: '13px' }}>
                          {item.isFav ? '❤️' : '🤍'}
                        </span>
                      </div>
                      <div style={{ padding: '12px' }}>
                        <p style={{ fontWeight: 700, fontSize: '12px', color: '#FAF8F5', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{item.name}</p>
                        <p style={{ fontSize: '10px', color: '#E0B865', marginTop: '2px' }}>{item.category}</p>
                        <p style={{ fontSize: '9px', color: '#B9A9D0', marginTop: '1px' }}>{item.brand}</p>
                        <button
                          onClick={() => deleteItem(item.id)}
                          style={{ marginTop: '8px', background: 'none', border: 'none', color: '#EF4444', fontSize: '10px', cursor: 'pointer' }}
                        >
                          Remove
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 2: AI STYLIST */}
            {tab === 'stylist' && (
              <div className="card-glass" style={{ padding: '20px', textAlign: 'center' }}>
                <h2 className="font-serif gold-gradient-text" style={{ fontSize: '22px', marginBottom: '6px' }}>Haute AI Consultation</h2>
                <p style={{ fontSize: '12px', color: '#B9A9D0', marginBottom: '16px' }}>Personal stylist analyzing only the pieces in your closet.</p>

                <div style={{ textAlign: 'left', marginBottom: '12px' }}>
                  <label style={{ fontSize: '11px', fontWeight: 600, color: '#E0B865' }}>OCCASION</label>
                  <select
                    value={occasion}
                    onChange={e => setOccasion(e.target.value)}
                    style={{ width: '100%', padding: '12px', background: '#10061F', border: '1px solid #3D246C', color: '#FAF8F5', borderRadius: '10px', marginTop: '4px', fontSize: '12px' }}
                  >
                    <option>Dinner Date & Cocktails</option>
                    <option>Executive Work & Boardroom</option>
                    <option>Casual Weekend Chic</option>
                    <option>Black-Tie Formal Gala</option>
                  </select>
                </div>

                <div style={{ textAlign: 'left', marginBottom: '16px' }}>
                  <label style={{ fontSize: '11px', fontWeight: 600, color: '#E0B865' }}>CLIMATE / WEATHER</label>
                  <input
                    type="text"
                    value={climate}
                    onChange={e => setClimate(e.target.value)}
                    style={{ width: '100%', padding: '12px', background: '#10061F', border: '1px solid #3D246C', color: '#FAF8F5', borderRadius: '10px', marginTop: '4px', fontSize: '12px' }}
                  />
                </div>

                <button onClick={curateOutfit} className="gold-btn" style={{ width: '100%', padding: '14px', borderRadius: '10px', fontSize: '13px' }}>
                  {loadingStylist ? 'Analyzing Closet Pieces...' : 'Curate Custom Look'}
                </button>

                {styledLook && (
                  <div style={{ background: '#10061F', border: '1px solid #E0B865', borderRadius: '12px', padding: '16px', textAlign: 'left', marginTop: '16px' }}>
                    <span style={{ fontSize: '9px', color: '#E0B865', fontWeight: 700, letterSpacing: '1px', textTransform: 'uppercase' }}>Curated Look</span>
                    <h3 className="font-serif" style={{ fontSize: '17px', color: '#FAF8F5', margin: '4px 0 8px 0' }}>{styledLook.title}</h3>
                    <p style={{ fontSize: '12px', color: '#B9A9D0', lineHeight: 1.6, fontStyle: 'italic', marginBottom: '12px' }}>"{styledLook.explanation}"</p>
                    
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '6px', marginBottom: '12px' }}>
                      {styledLook.pieces.map(p => (
                        <div key={p.id} style={{ background: '#180D2B', padding: '6px', borderRadius: '8px', textAlign: 'center', border: '1px solid #3D246C' }}>
                          <img src={p.img} alt={p.name} style={{ width: '100%', height: '60px', objectFit: 'cover', borderRadius: '6px', marginBottom: '4px' }} />
                          <p style={{ fontSize: '9px', fontWeight: 700, color: '#FAF8F5', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p.name}</p>
                        </div>
                      ))}
                    </div>

                    <button onClick={saveCurrentLook} className="gold-btn" style={{ width: '100%', padding: '10px', borderRadius: '8px', fontSize: '12px' }}>
                      Save to Lookbook
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* TAB 3: VIP PREMIUM */}
            {tab === 'premium' && (
              <div className="card-glass" style={{ padding: '22px', textAlign: 'center' }}>
                <div style={{ width: '56px', height: '56px', borderRadius: '50%', background: 'rgba(224, 184, 101, 0.15)', border: '1px solid #E0B865', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 12px auto', fontSize: '26px' }}>
                  👑
                </div>
                <h2 className="font-serif gold-gradient-text" style={{ fontSize: '24px', marginBottom: '4px' }}>NOVEIRA VIP ELITE</h2>
                <p style={{ fontSize: '11px', color: '#B9A9D0', textTransform: 'uppercase', letterSpacing: '2px', marginBottom: '18px' }}>High-Fashion Personal Concierge</p>

                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginBottom: '18px' }}>
                  <div
                    onClick={() => setSelectedPlan('monthly')}
                    style={{
                      padding: '14px',
                      borderRadius: '12px',
                      border: selectedPlan === 'monthly' ? '2px solid #E0B865' : '1px solid #3D246C',
                      background: selectedPlan === 'monthly' ? 'rgba(224, 184, 101, 0.1)' : '#10061F',
                      cursor: 'pointer'
                    }}
                  >
                    <p style={{ fontSize: '11px', fontWeight: 600, color: '#FAF8F5' }}>Monthly VIP</p>
                    <p className="font-serif" style={{ fontSize: '22px', fontWeight: 700, color: '#E0B865', margin: '4px 0' }}>$4.99</p>
                    <p style={{ fontSize: '9px', color: '#B9A9D0' }}>Billed monthly</p>
                  </div>

                  <div
                    onClick={() => setSelectedPlan('annual')}
                    style={{
                      padding: '14px',
                      borderRadius: '12px',
                      border: selectedPlan === 'annual' ? '2px solid #E0B865' : '1px solid #3D246C',
                      background: selectedPlan === 'annual' ? 'rgba(224, 184, 101, 0.1)' : '#10061F',
                      position: 'relative',
                      cursor: 'pointer'
                    }}
                  >
                    <div style={{ position: 'absolute', top: '-8px', right: '10px', background: '#E0B865', color: '#0E071A', fontSize: '8px', fontWeight: 800, padding: '2px 6px', borderRadius: '10px' }}>SAVE 33%</div>
                    <p style={{ fontSize: '11px', fontWeight: 600, color: '#FAF8F5' }}>Annual VIP</p>
                    <p className="font-serif" style={{ fontSize: '22px', fontWeight: 700, color: '#E0B865', margin: '4px 0' }}>$39.99</p>
                    <p style={{ fontSize: '9px', color: '#B9A9D0' }}>$3.33 / month</p>
                  </div>
                </div>

                <div style={{ background: '#10061F', borderRadius: '12px', padding: '16px', textAlign: 'left', marginBottom: '18px' }}>
                  <p style={{ fontSize: '11px', color: '#E0B865', fontWeight: 700, letterSpacing: '1px', marginBottom: '10px', textTransform: 'uppercase' }}>Exclusive Privileges</p>
                  {[
                    'Unlimited Haute AI styling consultations',
                    'Advanced silhouette and multi-garment matching',
                    'Unlimited digital wardrobe storage capacity',
                    'Exclusive lookb
