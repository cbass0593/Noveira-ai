<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Noveira AI — Digital Wardrobe & Personal Stylist</title>
  
  <!-- Luxury Editorial Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #0E071A;
      color: #FAF8F5;
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }
    .font-serif { font-family: 'Playfair Display', Georgia, serif; }
    .gold-gradient-text {
      background: linear-gradient(135deg, #FFF5DB 0%, #E0B865 50%, #C9A14F 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .gold-btn {
      background: linear-gradient(135deg, #F2D594 0%, #E0B865 50%, #C9A14F 100%);
      color: #0E071A;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(224, 184, 101, 0.25);
      transition: transform 0.15s ease;
    }
    .gold-btn:active { transform: scale(0.97); }
    .card-glass {
      background: #180D2B;
      border: 1px solid #3D246C;
      border-radius: 14px;
    }
    input, select {
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: #E0B865 !important;
    }
    .nav-btn {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div style="max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 80px; position: relative;">
    
    <!-- Header -->
    <header style="padding: 16px 20px; background: rgba(24, 13, 43, 0.95); border-bottom: 1px solid #3D246C; display: flex; justify-content: space-between; alignItems: center;">
      <div style="text-align: left;">
        <h1 class="font-serif gold-gradient-text" style="font-size: 22px; letter-spacing: 3px; font-weight: 700;">NOVEIRA AI</h1>
        <p style="font-size: 9px; color: #B9A9D0; letter-spacing: 2px; text-transform: uppercase;">Haute Wardrobe Atelier</p>
      </div>
      <div id="header-action"></div>
    </header>

    <!-- Main Content Mount -->
    <main id="main-content" style="padding: 16px;"></main>

    <!-- Fixed Bottom 4-Pillar Navigation -->
    <nav style="position: fixed; bottom: 0; left: 0; right: 0; height: 64px; background: rgba(24, 13, 43, 0.98); border-top: 1px solid #3D246C; display: flex; justify-content: space-around; align-items: center; max-width: 480px; margin: 0 auto; backdrop-filter: blur(10px); z-index: 100;">
      <button onclick="window.app.setTab('closet')" class="nav-btn" id="nav-closet">
        <span style="font-size: 18px;">👗</span>
        <span style="font-size: 10px;">My Closet</span>
